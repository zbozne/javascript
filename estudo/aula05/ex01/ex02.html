<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript porra</title>
</head>
<body>

    <script>
        var nome = window.prompt ('Qualé seu nomi?')
        document.write (`Seu nome tem ${nome.length} letras. <br>`) 
        document.write (`Seu nome em maisuculas é ${nome.toUpperCase()} <br>`)
        document.write (`Seu nome em maisuculas é ${nome.toLowerCase()}`)
    </script>
</body>
</html>
